# Docker Compose for the Coolify deployment (https://marketingai.randybeltran.xyz).
# Services: db, redis, minio, mailpit, api, worker, beat, frontend, nginx.
# Coolify (docker compose build pack) clones the repo, uses THIS file via
# docker_compose_location, and routes the domain to the nginx service.
# No host ports are mapped — all traffic goes through Coolify's proxy → nginx.
# Env vars are managed in Coolify (written to .env here, read by api/worker/beat).
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketing}
      POSTGRES_DB: ${POSTGRES_DB:-marketing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: always

  api:
    build: ./backend
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ./backend
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat:
    build: ./backend
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://marketingai.randybeltran.xyz/api}
    depends_on:
      - api

  nginx:
    build: ./nginx
    restart: always
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  miniodata:
