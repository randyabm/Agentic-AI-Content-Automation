server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # Use Docker's internal DNS resolver so upstream IPs are re-resolved on each request
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend API — strip /api prefix before forwarding
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Frontend — Vite dev server (override Host to bypass Vite's host-check security)
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_set_header Host localhost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
